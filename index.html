<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Employee Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
    }
    .portal-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Updated Position: Bottom se 60px upar */
    .zoom-container {
      position: fixed;
      bottom: 60px;
      right: 20px;
      z-index: 9999;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      padding: 6px 10px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .zoom-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .zoom-btn:hover {
      background: #1d4ed8;
    }
    .reset-btn {
      width: auto;
      padding: 0 10px;
      border-radius: 15px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="zoom-container">
    <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">+</button>
    <button class="zoom-btn reset-btn" onclick="resetZoom()" title="Reset">100%</button>
    <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">−</button>
  </div>

  <div class="portal-container" id="portalWrapper">
    <iframe id="portalFrame" src="https://script.google.com/macros/s/AKfycbzfm_KOI7vnAsNK5oetBjSlg9Df3wTYxyh6szG2U55XpF7MFIjTyB0LTndkUNpIdBOU/exec"></iframe>
  </div>

  <script>
    let currentZoom = 1;
    const wrapper = document.getElementById('portalWrapper');

    function applyZoom() {
      if ('zoom' in wrapper.style) {
        wrapper.style.zoom = currentZoom;
      } else {
        wrapper.style.transform = `scale(${currentZoom})`;
        wrapper.style.transformOrigin = 'top left';
        wrapper.style.width = `${100 / currentZoom}%`;
        wrapper.style.height = `${100 / currentZoom}%`;
      }
    }

    function zoomIn() {
      if (currentZoom < 1.25) {
        currentZoom += 0.05;
        applyZoom();
      }
    }

    function zoomOut() {
      if (currentZoom > 0.75) {
        currentZoom -= 0.05;
        applyZoom();
      }
    }

    function resetZoom() {
      currentZoom = 1;
      applyZoom();
    }
  </script>

</body>
</html>
