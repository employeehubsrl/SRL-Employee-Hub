<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- SECURITY POLICY FOR FRAME PROTECTION -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com https://script.googleusercontent.com 'unsafe-inline' 'unsafe-eval'; frame-src https://script.google.com https://script.googleusercontent.com;">
  <title>Employee Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .portal-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <!-- SECURE IFRAME WITH SANDBOX & NO-REFERRER PROTECTION -->
    <iframe 
      id="portalFrame" 
      src="https://script.google.com/macros/s/AKfycbzfm_KOI7vnAsNK5oetBjSlg9Df3wTYxyh6szG2U55XpF7MFIjTyB0LTndkUNpIdBOU/exec"
      title="Employee Self Service Portal"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-forms allow-same-origin allow-downloads allow-popups allow-modals">
    </iframe>
  </div>

</body>
</html>
