<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      min-height: 100vh;
      height: 100%;
      border: none;
      display: block;
      transform-origin: 0 0;
      transition: transform 0.2s ease;
    }

    /* Floating Zoom Buttons */
    .zoom-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      padding: 6px 10px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .zoom-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .zoom-btn:hover {
      background: #1d4ed8;
    }
    .reset-btn {
      width: auto;
      padding: 0 10px;
      border-radius: 15px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Zoom Controls -->
  <div class="zoom-container">
    <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">+</button>
    <button class="zoom-btn reset-btn" onclick="resetZoom()" title="Reset">100%</button>
    <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">−</button>
  </div>

  <iframe id="portalFrame" src="https://script.google.com/macros/s/AKfycbzfm_KOI7vnAsNK5oetBjSlg9Df3wTYxyh6szG2U55XpF7MFIjTyB0LTndkUNpIdBOU/exec"></iframe>

  <script>
    let scale = 1;
    const iframe = document.getElementById('portalFrame');

    function applyZoom() {
      iframe.style.transform = `scale(${scale})`;
      iframe.style.width = `${100 / scale}%`;
      iframe.style.height = `${100 / scale}vh`;
    }

    function zoomIn() {
      if (scale < 1.3) {
        scale += 0.05;
        applyZoom();
      }
    }

    function zoomOut() {
      if (scale > 0.6) {
        scale -= 0.05;
        applyZoom();
      }
    }

    function resetZoom() {
      scale = 1;
      applyZoom();
    }
  </script>

</body>
</html>
